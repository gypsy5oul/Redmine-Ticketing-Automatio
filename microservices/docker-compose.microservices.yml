  # ============================================================================
  # Frontend (React Application)
  # ============================================================================

  # Frontend Admin Portal
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.microservices
    container_name: devops-tickets-frontend
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "3000:80"
    depends_on:
      kong:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kong_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  microservices-network:
    driver: bridge
