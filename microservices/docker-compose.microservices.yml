      context: ../frontend
      dockerfile: Dockerfile.microservices
    container_name: devops-tickets-frontend
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "3000:80"
    depends_on:
      kong:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  kong_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  microservices-network:
    driver: bridge
  # External network to connect to postgres and redis from old app
  # Docker Compose prefixes network names with the project directory name
  devops-network:
    name: redmine-automation-v3_devops-network
    external: true
