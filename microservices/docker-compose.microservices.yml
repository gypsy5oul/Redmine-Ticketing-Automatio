      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      REDMINE_BASE_URL: ${REDMINE_BASE_URL}
      REDMINE_API_KEY: ${REDMINE_API_KEY}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_PORT: 8002
